# Render blueprint — one-click deploy of the Syntrx backend.
# Connect your GitHub repo to Render, then click "New + → Blueprint" and
# point it at this file. Render will create the service automatically.
#
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: syntrx-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: LLM_PROVIDER
        value: mock                 # set to "anthropic" or "openai" once you add a key
      - key: ANTHROPIC_API_KEY
        sync: false                 # filled in via the Render dashboard
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite:///./syntrx.db
      - key: CORS_ORIGINS
        value: https://syntrx.vercel.app
      - key: CORS_ORIGIN_REGEX
        value: https://.*\.vercel\.app
